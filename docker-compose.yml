services:
  db:
    image: postgres:17
    container_name: articles-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: articles_manager
      POSTGRES_USER: articles_app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U articles_app -d articles_manager"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
