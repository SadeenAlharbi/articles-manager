services:
  db:
    image: postgres:17
    container_name: articles-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: articles_manager
      POSTGRES_USER: articles_app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U articles_app -d articles_manager"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
    container_name: articles-api
    restart: unless-stopped
    volumes:
      - ./api:/var/www/html
    ports:
      - "8001:8001"
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: articles_manager
      DB_USERNAME: articles_app
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "composer install --no-interaction &&
             php artisan migrate --force &&
             php artisan serve --host=0.0.0.0 --port=8001"

  ui:
    image: node:20-alpine
    container_name: articles-ui
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./ui:/app
      - ui_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  pgdata:
  ui_node_modules:
